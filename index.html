<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市场部任务与项目运营平台</title>
<style>
  :root{
    --bg:#f4f5f7;--panel:#ffffff;--border:#e8eaed;--border-strong:#d8dce2;
    --text-1:#1f2937;--text-2:#5b6573;--text-3:#8a94a6;--text-4:#b3bac6;
    --blue:#4a7fc7;--teal:#2a9d8f;
    --shadow-sm:0 1px 2px rgba(31,41,55,.04);--shadow-md:0 2px 8px rgba(31,41,55,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text-1);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit}

  .topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border)}
  .topbar-inner{max-width:1480px;margin:0 auto;padding:14px 28px 12px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#4a7fc7,#2a9d8f);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
  .brand h1{font-size:17px;font-weight:600;letter-spacing:.2px}
  .brand p{font-size:12px;color:var(--text-3);margin-top:1px}
  .today-tag{margin-left:auto;font-size:13px;color:var(--text-2);background:#f1f3f6;padding:6px 14px;border-radius:8px;border:1px solid var(--border);font-weight:500;white-space:nowrap}

  .toolbar{max-width:1480px;margin:0 auto;padding:0 28px 12px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .tabs{display:flex;align-items:center;gap:4px;background:#f1f3f6;padding:4px;border-radius:9px;border:1px solid var(--border)}
  .tab{padding:7px 16px;font-size:13px;color:var(--text-2);border-radius:6px;transition:all .15s;font-weight:500;display:flex;align-items:center;gap:7px}
  .tab:hover{color:var(--text-1)}
  .tab.active{background:#fff;color:var(--text-1);box-shadow:var(--shadow-sm)}
  .tab .badge{font-size:11px;color:var(--text-3);background:#eef1f5;padding:1px 6px;border-radius:8px;font-weight:500}
  .tab.active .badge{background:#e9f0fb;color:var(--blue)}
  .filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .filters.hidden{display:none}
  .filter{padding:5px 12px;font-size:13px;color:var(--text-2);border-radius:7px;border:1px solid transparent;transition:all .15s;display:flex;align-items:center;gap:6px}
  .filter:hover{background:#f2f4f7;color:var(--text-1)}
  .filter.active{background:#e9f0fb;border-color:var(--blue);color:var(--blue);font-weight:600;box-shadow:var(--shadow-sm)}
  .filter-label{font-size:12px;color:var(--text-3);font-weight:600;margin-right:4px;user-select:none;letter-spacing:.2px}
  .avatar-mini{width:18px;height:18px;border-radius:50%;color:#fff;font-size:9px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .filter-divider{width:1px;height:16px;background:var(--border);margin:0 4px}
  .daily-card.hidden{display:none}

  .layout{max-width:1480px;margin:0 auto;padding:22px 28px 60px;display:flex;gap:24px;align-items:flex-start}
  .timeline{flex:1;min-width:0;max-width:calc(100% - 400px)}
  .sidebar{width:380px;flex-shrink:0;position:sticky;top:128px;max-height:calc(100vh - 148px);overflow-y:auto}
  .board[hidden]{display:none}

  .section-lead{margin-bottom:18px}
  .lead-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .section-lead h2{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
  .section-lead h2::before{content:"";width:3px;height:15px;background:var(--blue);border-radius:2px}
  .section-lead p{font-size:12.5px;color:var(--text-3);margin-top:5px;margin-left:11px}
  .add-btn{font-size:12.5px;font-weight:500;color:var(--blue);background:#e9f0fb;border:1px solid #cfdcf2;padding:6px 13px;border-radius:7px;transition:all .15s;display:flex;align-items:center;gap:4px}
  .add-btn:hover{background:#dbe8f7}
  .add-btn svg{width:13px;height:13px}

  .month-group{margin-bottom:24px}
  .month-header{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px;cursor:pointer;user-select:none}
  .month-title{display:flex;align-items:center;gap:10px}
  .month-title h3{font-size:15px;font-weight:600;letter-spacing:.3px}
  .month-count{font-size:12px;color:var(--text-3)}
  .collapse-arrow{width:15px;height:15px;color:var(--text-3);transition:transform .25s}
  .month-group.collapsed .collapse-arrow{transform:rotate(-90deg)}
  .current-tag{font-size:11px;font-weight:500;color:var(--blue);background:#e9f0fb;padding:2px 7px;border-radius:5px;border:1px solid #d4e2f5}
  .month-body{transition:max-height .35s ease,opacity .25s ease;overflow:hidden}
  .month-group.collapsed .month-body{max-height:0!important;opacity:0}

  .task-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;transition:border-color .15s,box-shadow .15s;overflow:hidden}
  .task-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md)}
  .task-card.hidden{display:none}
  .task-card.done{opacity:.72}
  .card-row{display:flex;align-items:center;gap:13px;padding:13px 17px}
  .task-deadline{width:40px;flex-shrink:0;text-align:center;line-height:1.15}
  .d-day{display:block;font-size:15px;font-weight:600}
  .d-month{display:block;font-size:11px;color:var(--text-3);margin-top:1px}
  .type-tag{font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:5px;white-space:nowrap;flex-shrink:0;background:var(--tg-bg);color:var(--tg-text);border:1px solid var(--tg-border)}
  .task-info{flex:1;min-width:0}
  .task-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task-card.done .task-name{text-decoration:line-through;text-decoration-color:var(--text-4);color:var(--text-2)}
  .task-project{font-size:12px;color:var(--text-3);margin-top:2px;display:inline-block}
  .task-project::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--text-4);margin-right:6px;vertical-align:middle}
  .task-avatars{display:flex;align-items:center;flex-shrink:0}
  .avatar{width:30px;height:30px;border-radius:50%;border:2px solid #fff;color:#fff;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(0,0,0,.03)}
  .task-avatars .avatar{margin-left:-9px}
  .task-avatars .avatar:first-child{margin-left:0}
  .node-count{font-size:11.5px;color:var(--text-3);flex-shrink:0;white-space:nowrap;background:#f7f8fa;padding:3px 8px;border-radius:5px}
  .node-count .done{color:var(--teal);font-weight:500}
  .side-due{font-size:11.5px;color:var(--text-3);background:#f7f8fa;padding:3px 8px;border-radius:5px;flex-shrink:0;white-space:nowrap}
  .icon-btn{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-3);transition:all .15s;flex-shrink:0}
  .icon-btn:hover{background:#f2f4f7;color:var(--text-1)}
  .icon-btn.del:hover{background:#fdeae8;color:#b54230}
  .icon-btn svg{width:14px;height:14px}
  .expand-btn{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-2);padding:5px 9px;border-radius:6px;border:1px solid transparent;transition:all .15s;flex-shrink:0}
  .expand-btn:hover{background:#f2f4f7;border-color:var(--border)}
  .expand-btn .arrow{width:13px;height:13px;transition:transform .25s}
  .task-card.expanded .expand-btn .arrow{transform:rotate(180deg)}
  .task-card.expanded .expand-btn{color:var(--blue)}

  .checkbox-round{width:20px;height:20px;border-radius:50%;border:1.8px solid #c6ccd6;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
  .checkbox-round:hover{border-color:var(--teal)}
  .checkbox-round svg{width:12px;height:12px;opacity:0;transform:scale(.5);transition:all .15s}
  .task-nodes{max-height:0;overflow:hidden;transition:max-height .35s ease;border-top:1px solid transparent}
  .task-card.expanded .task-nodes{max-height:900px;border-top:1px solid var(--border)}
  .nodes-inner{padding:10px 17px 14px 61px;position:relative}
  .nodes-inner::before{content:"";position:absolute;left:68px;top:8px;bottom:14px;width:2px;background:#eef0f3;border-radius:1px}
  .node{display:flex;align-items:center;gap:12px;padding:8px 0;position:relative}
  .node::before{content:"";position:absolute;left:-57px;top:50%;width:18px;height:2px;background:#eef0f3}
  .node:first-child::before{display:none}
  .checkbox{width:18px;height:18px;border-radius:5px;border:1.8px solid #c6ccd6;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;position:relative;z-index:1}
  .checkbox:hover{border-color:var(--teal)}
  .checkbox svg{width:11px;height:11px;opacity:0;transform:scale(.5);transition:all .15s}
  .node.done .checkbox{background:var(--teal);border-color:var(--teal)}
  .node.done .checkbox svg{opacity:1;transform:scale(1)}
  .node-name{font-size:13px;flex:1;min-width:0;transition:all .15s}
  .node.done .node-name{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--text-4)}
  .node-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-3);flex-shrink:0}
  .node-owner{display:flex;align-items:center;gap:5px}
  .node-owner .avatar{width:20px;height:20px;font-size:9px;border-width:1.5px;margin:0}
  .node-deadline{background:#f7f8fa;padding:2px 7px;border-radius:4px;color:var(--text-2)}
  .node.done .node-deadline{color:var(--text-4)}

  .daily-group{margin-bottom:26px}
  .daily-group-header{display:flex;align-items:center;gap:10px;padding:2px 2px 12px}
  .daily-group-header h3{font-size:15px;font-weight:600}
  .freq-pill{font-size:11px;font-weight:500;padding:2px 8px;border-radius:5px}
  .freq-pill.daily{background:#e9f0fb;color:#2c5fa8;border:1px solid #cfdcf2}
  .freq-pill.weekly{background:#e9f5f2;color:#1e7a6e;border:1px solid #cfe7e0}
  .freq-pill.monthly{background:#f1ecf8;color:#6e4fa3;border:1px solid #ddd0ee}
  .daily-count{font-size:12px;color:var(--text-3);margin-left:auto}
  .daily-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .daily-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;transition:border-color .15s,box-shadow .15s}
  .daily-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md)}
  .daily-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;gap:8px}
  .daily-left{display:flex;align-items:center;gap:8px}
  .daily-next{font-size:11.5px;color:var(--text-3)}
  .daily-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
  .daily-card:hover .daily-actions{opacity:1}
  .daily-name{font-size:14px;font-weight:500;margin-bottom:4px}
  .daily-desc{font-size:12.5px;color:var(--text-3);line-height:1.5;margin-bottom:12px;min-height:36px}
  .daily-bottom{display:flex;align-items:center;justify-content:space-between;padding-top:11px;border-top:1px solid var(--border)}
  .daily-owner{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2)}
  .daily-owner .avatar{width:24px;height:24px;font-size:10px;border-width:1.5px;margin:0}
  .daily-progress{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
  .progress-text{background:#f7f8fa;padding:3px 9px;border-radius:5px}
  .progress-text .p-done{color:var(--teal);font-weight:600}
  .check-btn{width:26px;height:26px;border-radius:6px;border:1.5px solid #c6ccd6;background:#fff;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .check-btn:hover{border-color:var(--teal);background:#f3faf8}
  .check-btn svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:all .15s}
  .daily-card.complete .check-btn{background:var(--teal);border-color:var(--teal)}
  .daily-card.complete .check-btn svg{opacity:1;transform:scale(1)}

  .sidebar-title{font-size:15px;font-weight:600;padding:0 2px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);margin-bottom:14px}
  .sidebar-title .scope{font-size:11px;font-weight:500;color:var(--blue);background:#e9f0fb;padding:2px 8px;border-radius:5px;border:1px solid #d4e2f5}
  .reminder-list{display:flex;flex-direction:column;gap:9px}
  .reminder-card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:12px 14px;border-left:3px solid var(--rc-bar);transition:box-shadow .15s,border-color .15s;cursor:pointer;text-align:left;width:100%}
  .reminder-card:hover{box-shadow:var(--shadow-md);border-color:var(--border-strong)}
  .reminder-card.overdue{--rc-bar:#c0392b}
  .reminder-card.urgent{--rc-bar:#e85d4a}
  .reminder-card.watch{--rc-bar:#e89545}
  .reminder-card.remind{--rc-bar:#4a7fc7}
  .reminder-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .reminder-tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:4px;letter-spacing:.3px}
  .reminder-card.overdue .reminder-tag{background:#f6d9d5;color:#a02818}
  .reminder-card.urgent .reminder-tag{background:#fdeae8;color:#b54230}
  .reminder-card.watch .reminder-tag{background:#fdf3e8;color:#b06a28}
  .reminder-card.remind .reminder-tag{background:#e9f0fb;color:#2c5fa8}
  .reminder-due{font-size:11.5px;color:var(--text-2);font-weight:500}
  .reminder-name{font-size:13px;font-weight:600;margin-bottom:6px;line-height:1.4}
  .reminder-avatars{display:flex;align-items:center}
  .reminder-avatars .avatar{width:22px;height:22px;font-size:9.5px;border-width:1.5px;margin-left:-7px}
  .reminder-avatars .avatar:first-child{margin-left:0}
  .reminder-meta{font-size:11.5px;color:var(--text-3);line-height:1.45}
  .reminder-meta .src{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;background:#f1f3f6;color:var(--text-2);margin-right:7px;font-weight:500}
  .reminder-empty{text-align:center;padding:28px 10px;color:var(--text-3);font-size:12.5px;line-height:1.7}
  .reminder-card.star{--rc-bar:#e8a32c}
  .reminder-card.star .reminder-tag{background:#fdf3e0;color:#a87010}
  .reminder-head-right{display:flex;align-items:center;gap:8px}
  .ignore-btn{font-size:11px;color:var(--text-3);background:#f7f8fa;border:1px solid var(--border);padding:2px 9px;border-radius:4px;transition:all .15s;white-space:nowrap}
  .ignore-btn:hover{color:#b54230;border-color:#f6cdc6;background:#fdeae8}
  .star-btn{display:flex;align-items:center;gap:4px;font-size:11.5px;padding:5px 9px;border-radius:6px;border:1px solid transparent;transition:all .15s;color:var(--text-3);flex-shrink:0;white-space:nowrap}
  .star-btn:hover{background:#fdf3e0;color:#a87010}
  .star-btn.on{color:#a87010;background:#fdf3e0;border-color:#f3d9a8}
  .star-btn.ignored{color:var(--text-3);background:#f1f3f6;border:1px dashed var(--border-strong)}
  .star-btn svg{width:13px;height:13px}
  .star-btn.mini{padding:3px;border-radius:5px}
  .star-btn.mini svg{width:14px;height:14px}
  .day-checks{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .day-check{width:22px;height:22px;border-radius:5px;border:1.6px solid #c6ccd6;background:#fff;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .day-check:hover{border-color:var(--teal)}
  .day-check svg{width:12px;height:12px;opacity:0;transform:scale(.5);transition:all .15s}
  .day-check.done{background:var(--teal);border-color:var(--teal)}
  .day-check.done svg{opacity:1;transform:scale(1)}
  .btn-del{background:#e85d4a;color:#fff}
  .btn-del:hover{background:#d04938}
  @keyframes flashhl{0%,100%{box-shadow:0 0 0 0 rgba(74,127,199,0)}50%{box-shadow:0 0 0 3px rgba(74,127,199,.4)}}
  .task-card.flash,.daily-card.flash{animation:flashhl 1.7s ease;border-color:var(--blue)!important}

  .sidebar::-webkit-scrollbar{width:6px}
  .sidebar::-webkit-scrollbar-thumb{background:#d8dce2;border-radius:3px}
  .empty-hint{display:none;text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px}
  .empty-hint.show{display:block}

  .overlay{position:fixed;inset:0;background:rgba(31,41,55,.42);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:12px;width:580px;max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 12px 40px rgba(31,41,55,.18)}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
  .modal-head h3{font-size:16px;font-weight:600}
  .modal-close{font-size:22px;color:var(--text-3);width:30px;height:30px;border-radius:6px;line-height:1}
  .modal-close:hover{background:#f2f4f7;color:var(--text-1)}
  .modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;color:var(--text-2);font-weight:500}
  .field input,.field select,.field textarea{border:1px solid var(--border-strong);border-radius:7px;padding:8px 11px;font-size:13px;outline:none;transition:border-color .15s;width:100%}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue)}
  .field textarea{resize:vertical}
  .field-row{display:flex;gap:12px}
  .field-row .field{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:4px 11px;border-radius:14px;border:1px solid var(--border-strong);background:#fff;color:var(--text-2);cursor:pointer;transition:all .15s;user-select:none}
  .chip:hover{border-color:var(--blue)}
  .chip.selected{background:#e9f0fb;border-color:var(--blue);color:var(--blue);font-weight:500}
  .node-editor{border:1px solid var(--border);border-radius:8px;padding:12px}
  .node-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  .node-row{display:flex;gap:8px;align-items:center}
  .node-row input{flex:1;border:1px solid var(--border-strong);border-radius:6px;padding:6px 9px;font-size:12.5px;outline:none;min-width:0}
  .node-row input:focus{border-color:var(--blue)}
  .node-row .nd-due{display:flex;gap:4px;align-items:center}
  .node-row .nd-due select{border:1px solid var(--border-strong);border-radius:6px;padding:6px 6px;font-size:12.5px;outline:none;max-width:70px}
  .node-row .nd-due select:focus{border-color:var(--blue)}
  .node-row .nd-owner{max-width:110px;list-style:none}
  .node-row .nd-done{display:flex;align-items:center;gap:3px;font-size:11.5px;color:var(--text-3);white-space:nowrap}
  .node-row .del-node{color:var(--text-3);width:24px;height:24px;border-radius:5px;font-size:16px;flex-shrink:0}
  .node-row .del-node:hover{background:#fdeae8;color:#b54230}
  .add-node-btn{font-size:12.5px;color:var(--blue);padding:5px 10px;border-radius:6px;border:1px dashed var(--blue);background:#f7fafe}
  .add-node-btn:hover{background:#e9f0fb}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff}
  .btn{padding:8px 18px;border-radius:7px;font-size:13px;font-weight:500;transition:all .15s}
  .btn-cancel{background:#f1f3f6;color:var(--text-2)}
  .btn-cancel:hover{background:#e8eaed}
  .btn-save{background:var(--blue);color:#fff}
  .btn-save:hover{background:#3a6db5}

  @media (max-width:1100px){
    .sidebar{display:none}.layout{padding:20px}.daily-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header class="topbar">

      </div>

    <section class="board" id="board-side" hidden>
      <div class="section-lead">
        <div class="lead-head"><h2>支线任务</h2><button class="add-btn" onclick="openEditor('side')"><svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>添加任务</button></div>

</div>

const MEMBER_LIST = Object.keys(MEMBER_COLOR);
const firstChar = n => n.slice(0,1);
function avatar(name, idx){
  const color = MEMBER_COLOR[name] || '#8a94a6';
  return `<div class="avatar" style="background:${color};z-index:${10-(idx||0)}" title="${name}">${firstChar(name)}</div>`;
}
function avatarSmall(name){
  const color = MEMBER_COLOR[name] || '#8a94a6';
  return `<span class="avatar" style="background:${color}" title="${name}">${firstChar(name)}</span>`;

/* ============ 日期辅助 ============ */
/* TODAY 取本地电脑当前时间，截取到日期（去掉时分秒） */
const TODAY = new Date();
TODAY.setHours(0,0,0,0);
function addDays(date, n){ const d = new Date(date); d.setDate(d.getDate()+n); return d; }
function addWorkdays(date, n){ const d = new Date(date); let c=0; while(c<n){ d.setDate(d.getDate()+1); const w=d.getDay(); if(w!==0&&w!==6) c++; } return d; }
function fmtDate(d){ return (d.getMonth()+1)+'月'+d.getDate()+'日'; }

/* ============ 展会节点统一模板 ============ */
/* dom=国内展前N天, ovs=海外展前N天; special: day1=开展首日, day2=开展第2日12:00前, work2=展后2个工作日 */
const EXH_TEMPLATE = [
  {name:'展会报名', owner:'车惠', dom:-180, ovs:-270},
  {name:'展位位置及面积确认', owner:'车惠', dom:-120, ovs:-180},
  {name:'展位设计', owner:'徐仲新', dom:-105, ovs:-150},

  {name:'展位报图及主办方审核', owner:'车惠', dom:-60, ovs:-90},
  {name:'展品及展示方案确认', owner:'徐仲新', dom:-60, ovs:-120},
  {name:'海报与客户邀请函设计', owner:'邹妤泽', dom:-45, ovs:-60},
  {name:'展商证办理', owner:'车惠', dom:-45, ovs:-60},
  {name:'样机确认与申请', owner:'代怡文', dom:-30, ovs:-120},
  {name:'样册、礼品及市场物料准备', owner:'代怡文', dom:-14, ovs:-90},
  {name:'国内社媒及官网预热推广', owner:'王梦', dom:-14, ovs:-14},
  {name:'海外社媒预热推广', owner:'徐仲新', dom:-14, ovs:-21},
  {name:'重点客户邀请', owner:'车惠', dom:-14, ovs:-30},
  {name:'参展人员安排及展前培训', owner:'徐仲新', dom:-7, ovs:-14},
  {name:'展会物料及样机运输', owner:'代怡文', dom:-3, ovs:-75},
  {name:'展会现场照片及视频拍摄', owner:'邹妤泽', special:'day1'},
  {name:'展会首日视频制作与发布', owner:'王梦', special:'day2'},
  {name:'客户信息整理', owner:'王梦', special:'work2'},
  {name:'展会复盘', owner:'徐仲新', dom:7, ovs:7},
  {name:'次年展位预订', owner:'车惠', dom:30, ovs:30}
];
const EXHIBITIONS = [
  {id:'ex0722',  name:'印度工业及自动化展览会',          start:'2026-07-22', overseas:true},
  {id:'ex0909',  name:'中国国际光电博览会(CIOE)',         start:'2026-09-09', overseas:false},
  {id:'ex1012a', name:'中国国际工业博览会(CIIF)',         start:'2026-10-12', overseas:false},
  {id:'ex1012b', name:'中国国际全印展',                   start:'2026-10-12', overseas:false},
  {id:'ex1015',  name:'第140届广交会',                    start:'2026-10-15', overseas:false},
  {id:'ex1120',  name:'中国国际纺织机械展(CITME)',        start:'2026-11-20', overseas:false},
  {id:'ex1123',  name:'印度设备工具展Engitech',           start:'2026-11-23', overseas:true},
  {id:'ex1124',  name:'德国国际工业自动化展览会(SPS)',     start:'2026-11-24', overseas:true},
  {id:'ex1210',  name:'Luna印度包装展Intrapac',          start:'2026-12-10', overseas:true}
];
function isoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function buildExhNodes(exh){
  const start = new Date(exh.start + 'T00:00:00');
  const key = exh.overseas ? 'ovs' : 'dom';
  return EXH_TEMPLATE.map(tpl => {
    let dueDate, deadlineStr;
    if(tpl.special === 'day1'){ dueDate = start; deadlineStr = fmtDate(start); }
    else if(tpl.special === 'day2'){ dueDate = addDays(start,1); deadlineStr = fmtDate(dueDate) + ' 12:00前'; }
    else if(tpl.special === 'work2'){ dueDate = addWorkdays(start,2); deadlineStr = fmtDate(dueDate); }
    else { const n = tpl[key]; dueDate = addDays(start, n); deadlineStr = fmtDate(dueDate); }
    const done = dueDate < TODAY;
    return { name: tpl.name, owner: tpl.owner, deadline: deadlineStr, dueDateISO: isoDate(dueDate), done };
  });
}
function buildExhTask(exh){
  const start = new Date(exh.start + 'T00:00:00');
  const nodes = buildExhNodes(exh);
  const members = [...new Set(nodes.map(n=>n.owner))];
  return {
    id: exh.id, type:'offline',
    deadlineYear: String(start.getFullYear()),
    deadlineDay: String(start.getDate()),
    deadlineMonth: (start.getMonth()+1)+'月',
    name: exh.name,
    project: exh.overseas ? '线下营销·国外展会' : '线下营销·国内展会',
    members, nodes
  };
}
/* 经销商大会节点模板（基于会议日期计算） */
const DEALER_TEMPLATE = [
  {name:'酒店合同签订及首款支付', owner:'车惠', days:-240},
  {name:'搭建展示方案设计', owner:'徐仲新', days:-120},
  {name:'会议议程确认', owner:'徐仲新', days:-90},
  {name:'演讲PPT制作', owner:'徐仲新', days:-90},
  {name:'晚宴节目、酒水安排', owner:'车惠', days:-90},
  {name:'电子邀请函及报名二维码制作', owner:'邹妤泽', days:-90},
  {name:'会场视觉及指引物料设计', owner:'邹妤泽', days:-30},
  {name:'住宿、桌位及重点客户接待安排', owner:'车惠', days:-14},
  {name:'产品、样册、礼品及会议物料准备', owner:'代怡文', days:-14},
  {name:'会议PPT修改合并', owner:'徐仲新', days:-14},
  {name:'会场主持串场台词准备', owner:'邹妤泽', days:-7},
  {name:'会议物资及展示产品运输', owner:'代怡文', days:-5},
  {name:'人员分工及流程培训', owner:'徐仲新', days:-3},
  {name:'会场布置及产品安装调试', owner:'徐仲新', days:-1},
  {name:'现场照片及视频素材拍摄', owner:'车惠', special:'day1'},
  {name:'大会新闻及视频内容发布', owner:'王梦', special:'work2'},
  {name:'酒店及活动费用结算', owner:'车惠', days:7},
  {name:'经销商大会总结与复盘', owner:'徐仲新', days:7}
];
function buildDealerTask(startDate, name, id){
  const start = new Date(startDate + 'T00:00:00');
  const nodes = DEALER_TEMPLATE.map(tpl => {
    let dueDate, deadlineStr;
    if(tpl.special === 'day1'){ dueDate = start; deadlineStr = fmtDate(start); }
    else if(tpl.special === 'work2'){ dueDate = addWorkdays(start,2); deadlineStr = fmtDate(dueDate); }
    else { dueDate = addDays(start, tpl.days); deadlineStr = fmtDate(dueDate); }
    const done = dueDate < TODAY;
    return { name: tpl.name, owner: tpl.owner, deadline: deadlineStr, dueDateISO: isoDate(dueDate), done };
  });
  const members = [...new Set(nodes.map(n=>n.owner))];
  return {
    id, type:'offline',
    deadlineYear: String(start.getFullYear()),
    deadlineDay: String(start.getDate()),
    deadlineMonth: (start.getMonth()+1)+'月',
    name, project:'线下营销·经销商大会',
    members, nodes
  };
}

function buildMainTaskData(){
  const tasks = EXHIBITIONS.map(buildExhTask);
  tasks.push({ id:'extbc', type:'offline', deadlineYear:'2026', deadlineDay:'待定', deadlineMonth:'12月', name:'Pune区域新代理商行业展会', project:'线下营销·国外展会（待定）', members:['杨艳翎'], nodes:[{name:'待展期确认后启动筹备',owner:'杨艳翎',deadline:'12月31日',done:false}] });
  tasks.push(buildDealerTask('2027-03-05', '2027年全国经销商大会', 'dealer2027'));
  const groups = {};
  tasks.forEach(t => {
    const m = parseInt(String(t.deadlineMonth).replace(/[^\d]/g,''));
    const y = t.deadlineYear || '2026';
    const key = y + '-' + String(m).padStart(2,'0');
    if(!groups[key]) groups[key] = { month:y+'年'+m+'月', monthKey:key, tasks:[] };
    groups[key].tasks.push(t);
  });
  const arr = Object.values(groups).sort((a,b)=> a.monthKey.localeCompare(b.monthKey));
  if(arr[0]) arr[0].current = true;
  return arr;
}

/* ============ 默认数据 ============ */
let mainTaskData = buildMainTaskData();

  { id:'se4',  type:'materials', deadlineYear:'2026', deadlineMonth:'8月',  deadlineDay:'21', name:'HMI画面设计翻译',         project:'宣传资料', members:['代怡文'], desc:'HMI 画面设计文档的多语言翻译与校对。', done:false },
  { id:'se5',  type:'materials', deadlineYear:'2026', deadlineMonth:'9月',  deadlineDay:'30', name:'西葡语资料翻译',           project:'宣传资料', members:['代怡文'], desc:'产品及宣传资料的西班牙语、葡萄牙语翻译。', done:false },

  { id:'se8',  type:'online',    deadlineYear:'2026', deadlineMonth:'9月',  deadlineDay:'18', name:'BSP信息发布平台规划',      project:'线上营销', members:['徐仲新'], desc:'BSP 信息发布平台的功能规划与方案制定。', done:false },
  { id:'se9',  type:'offline',   deadlineYear:'2026', deadlineMonth:'10月', deadlineDay:'31', name:'展厅装修',                project:'线下营销', members:['徐仲新'], desc:'公司展厅装修方案设计与施工落地。', done:false },
  { id:'se10', type:'ability',   deadlineYear:'2026', deadlineMonth:'9月',  deadlineDay:'30', name:'产品学习',                project:'能力提升', members:['邹妤泽'], desc:'新产品知识学习与内部培训。', done:false },
  { id:'se11', type:'materials', deadlineYear:'2026', deadlineMonth:'8月',  deadlineDay:'31', name:'产品素材整理',             project:'宣传资料', members:['邹妤泽'], desc:'产品图片、视频、文档等素材的整理归档。', done:false },

  { id:'se14', type:'online',    deadlineYear:'2026', deadlineMonth:'8月',  deadlineDay:'31', name:'官网案例更新',             project:'线上营销', members:['王梦'],   desc:'官网客户案例栏目内容更新与补充。', done:false },
  { id:'se15', type:'online',    deadlineYear:'2026', deadlineMonth:'8月',  deadlineDay:'14', name:'官网新闻更新',             project:'线上营销', members:['王梦'],   desc:'官网公司新闻栏目内容更新与发布。', done:false }
];

/* ============ 持久化 ============ */
const STORAGE_KEY = 'mkt-ops-platform-v12';
function saveData(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({main:mainTaskData, side:sideTasks, daily:dailyTaskData})); }catch(e){} }
function loadData(){ try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw){ const d = JSON.parse(raw); mainTaskData=d.main; sideTasks=d.side; dailyTaskData=d.daily; } }catch(e){} }

/* ============ 渲染：主线 ============ */
function renderMain(){
  document.getElementById('mainTimeline').innerHTML = mainTaskData.map(m => `
    <section class="month-group${m.current?' current':''}" data-month="${m.monthKey}" data-board="main">

/* ============ 重要提醒（手动星标，可忽略/恢复） ============ */
let currentBoard = 'main';
function parseDue(monthStr, dayStr, yearStr){
  const m = parseInt(String(monthStr).replace(/[^\d]/g,''));
  const d = parseInt(dayStr);
  const y = parseInt(yearStr) || 2026;
  const dt = new Date(y, (m||1)-1, d||1);
  return isNaN(dt.getTime())?null:dt;
}
function safeDue(t){ try{ const dt = parseDue(t.deadlineMonth, t.deadlineDay, t.deadlineYear); return dt; }catch(e){ return null; } }
function parseNodeDue(node, yearStr){
  if(node && node.dueDateISO){ const d = new Date(node.dueDateISO+'T00:00:00'); return isNaN(d.getTime())?null:d; }
  const s = (node && node.deadline) ? node.deadline : String(node);
  const mt = String(s).match(/(\d+)月(\d+)日/);
  if(!mt) return null;
  const y = parseInt(yearStr) || 2026;
  const dt = new Date(y, +mt[1]-1, +mt[2]);
  return isNaN(dt.getTime())?null:dt;
}
function dayDiff(due){ const t = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate()); const u = new Date(due.getFullYear(), due.getMonth(), due.getDate()); return Math.round((u - t)/86400000); }
function starState(t){
  if(t.starred && t.ignored) return {cls:'ignored', label:'已忽略·恢复', fill:'none'};
  if(t.starred) return {cls:'on', label:'已加重要', fill:'currentColor'};
  return {cls:'', label:'加重要', fill:'none'};
}
function starBtn(board, t){
  const s = starState(t);
  return `<button class="star-btn ${s.cls}" onclick="toggleStar('${board}','${t.id}')" title="重要提醒">
    <svg viewBox="0 0 16 16" fill="${s.fill}"><path d="M8 1.6l2 4.3 4.7.5-3.5 3.2 1 4.6L8 12.4 3.8 14.2l1-4.6L1.3 6.4l4.7-.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
    <span>${s.label}</span></button>`;
}
function nodeStarBtn(taskId, idx, n){
  const s = starState(n);
  return `<button class="star-btn mini ${s.cls}" onclick="event.stopPropagation();toggleNodeStar('${taskId}',${idx})" title="加重要">
    <svg viewBox="0 0 16 16" fill="${s.fill}"><path d="M8 1.6l2 4.3 4.7.5-3.5 3.2 1 4.6L8 12.4 3.8 14.2l1-4.6L1.3 6.4l4.7-.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>`;
}
function toggleStar(board, id){
  const t = findTask(board, id); if(!t) return;
  if(!t.starred){ t.starred = true; t.ignored = false; }
  else if(t.starred && !t.ignored){ t.starred = false; t.ignored = false; }
  else { t.ignored = false; }
  saveData(); renderAll();
}
function toggleNodeStar(taskId, idx){
  const task = findTask('main', taskId); if(!task) return;
  const n = task.nodes[idx];
  if(!n.starred){ n.starred = true; n.ignored = false; }
  else if(n.starred && !n.ignored){ n.starred = false; n.ignored = false; }
  else { n.ignored = false; }
  saveData(); renderAll();
}
function ignoreStar(board, id, idx, source){
  const setIgn = (obj)=>{ if(source==='star') obj.ignored = true; else obj.autoIgnored = true; };
  if(board==='main' && idx>=0){
    const task = findTask('main', id); if(!task) return;
    setIgn(task.nodes[idx]);
  } else {
    const t = findTask(board, id); if(!t) return;
    setIgn(t);
  }
  saveData(); renderAll();
}
/* 重要提醒 = 手动星标项 + 自动临近项(≤7天未完成) */
function buildImportant(){
  const list = [];
  if(currentBoard==='main'){
    mainTaskData.forEach(m=>m.tasks.forEach(t=>{
      t.nodes.forEach((n,idx)=>{
        if(n.done) return;
        const due = parseNodeDue(n, t.deadlineYear);
        const days = due ? dayDiff(due) : null;
        const isStar = n.starred && !n.ignored;
        const isAuto = due!==null && days<=7 && !n.autoIgnored;
        if(isStar) list.push({board:'main', id:t.id, idx, name:n.name, project:t.name, due, days, members:[n.owner], source:'star'});
        else if(isAuto) list.push({board:'main', id:t.id, idx, name:n.name, project:t.name, due, days, members:[n.owner], source:'auto'});
      });
    }));
  } else if(currentBoard==='side'){
    sideTasks.forEach(t=>{
      if(t.done) return;
      const due = safeDue(t); const days = due?dayDiff(due):null;
      const isStar = t.starred && !t.ignored;
      const isAuto = due && days<=7 && !t.autoIgnored;
      if(isStar) list.push({board:'side', id:t.id, idx:-1, name:t.name, project:t.project||'', due, days, members:t.members, source:'star'});
      else if(isAuto) list.push({board:'side', id:t.id, idx:-1, name:t.name, project:t.project||'', due, days, members:t.members, source:'auto'});
    });
  } else if(currentBoard==='daily'){
    const now = new Date();
    const dow = now.getDay(); // 0=Sun ... 4=Thu, 5=Fri, 6=Sat
    const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const isLastWeek = daysInMonth - now.getDate() < 7;
    dailyTaskData.forEach(g=>g.tasks.forEach(t=>{
      const isStar = t.starred && !t.ignored;
      const owners = t.owners || [t.owner];
      // auto reminder rules by frequency
      let isAuto = false;
      if(!t.autoIgnored){
        if(g.freq==='daily') isAuto = true;
        else if(g.freq==='weekly') isAuto = (dow===4 || dow===5); // Thu/Fri
        else if(g.freq==='monthly') isAuto = isLastWeek;
      }
      if(isStar) list.push({board:'daily', id:t.id, idx:-1, name:t.name, project:g.group, due:null, days:null, members:owners, source:'star'});
      else if(isAuto) list.push({board:'daily', id:t.id, idx:-1, name:t.name, project:g.group, due:null, days:null, freq:g.freq, members:owners, source:'auto'});
    }));
  }
  list.sort((a,b)=> importanceRank(a) - importanceRank(b));
  if(currentFilters.length>0){
    return list.filter(r=> r.members.some(m=>currentFilters.includes(m)));
  }
  return list;
}
function importanceRank(r){
  if(r.source==='auto'){
    if(r.days===null){ if(r.freq==='daily') return 0; if(r.freq==='weekly') return 3; return 6; }
    if(r.days<0) return -2;
    return r.days; // 0-7
  }
  if(r.due) return 10 + Math.max(0, r.days||0);
  return 20;
}
function levelOfImp(r){
  if(r.source==='star') return {cls:'star', label:'重要'};
  if(r.days===null) return {cls:'watch', label: r.freq==='daily'?'每日待办':r.freq==='weekly'?'本周待完成':'本月待完成'};
  if(r.days<0) return {cls:'urgent', label:'已逾期'};
  if(r.days===0) return {cls:'urgent', label:'今日截止'};
  if(r.days<=3) return {cls:'urgent', label:'还剩'+r.days+'天'};
  return {cls:'watch', label:'还剩'+r.days+'天'};
}
function renderReminders(){
  const scopeLabel = {main:'主线', side:'支线', daily:'日常'};
  document.getElementById('reminderScope').textContent = scopeLabel[currentBoard];
  const list = buildImportant();
  const el = document.getElementById('reminderList');
  if(list.length===0){
    el.innerHTML = `<div class="reminder-empty">暂无重要提醒<br>临近截止会自动显示，也可手动星标添加</div>`;
    return;
  }
  el.innerHTML = list.map(r=>{
    const lv = levelOfImp(r);
    const dueText = r.due ? `${r.due.getMonth()+1}月${r.due.getDate()}日` : '—';
    const avatars = r.members.slice(0,5).map((m,i)=>avatar(m,i)).join('');
    return `<div class="reminder-card ${lv.cls}" onclick="jumpTo('${r.board}','${r.id}')">
      <div class="reminder-head">
        <span class="reminder-tag">${lv.label}</span>
        <div class="reminder-head-right">
          <div class="reminder-avatars">${avatars}</div>
          <span class="reminder-due">${dueText}</span>
          <button class="ignore-btn" onclick="event.stopPropagation();ignoreStar('${r.board}','${r.id}',${r.idx},'${r.source}')">忽略</button>
        </div>
      </div>
      <div class="reminder-name">${r.name}</div>
      <div class="reminder-meta"><span class="src">${scopeLabel[r.board]}</span>${r.project||''}</div>
    </div>`;
  }).join('');
}
function jumpTo(board, id){
  if(board !== currentBoard) switchBoard(board);
  setTimeout(()=>{
    let target = document.querySelector(`.task-card[data-id="${id}"][data-board="${board}"]`);
    if(!target) target = document.querySelector(`.daily-card[data-id="${id}"]`);
    if(!target) return;
    target.scrollIntoView({behavior:'smooth', block:'center'});
    if(board==='main'){
      if(!target.classList.contains('expanded')) toggleTask({stopPropagation(){}}, target.querySelector('.expand-btn'));
    }
    target.classList.add('flash');
    setTimeout(()=>target.classList.remove('flash'), 1700);
  }, board!==currentBoard?150:0);
}

/* ============ 交互 ============ */
function toggleMonth(headerEl){
  const group = headerEl.closest('.month-group');
  group.classList.toggle('collapsed');
  const body = group.querySelector('.month-body');
  if(group.classList.contains('collapsed')){
    body.style.maxHeight = body.scrollHeight + 'px';
    requestAnimationFrame(()=>{ body.style.maxHeight = '0px'; });
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';
    setTimeout(()=>{ if(!group.classList.contains('collapsed')) body.style.maxHeight='none'; },360);
  }
}
function toggleTask(e, btn){
  e.stopPropagation();
  const card = btn.closest('.task-card');
  card.classList.toggle('expanded');
  const nodes = card.querySelector('.task-nodes');
  if(card.classList.contains('expanded')){
    nodes.style.maxHeight = nodes.scrollHeight + 'px';
    btn.querySelector('.btn-text').textContent = '收起';
  } else {
    nodes.style.maxHeight = '0px';
    btn.querySelector('.btn-text').textContent = '展开';
  }
}
function onCardClick(e, row){
  if(e.target.closest('button')) return;
  const card = row.closest('.task-card');
  const btn = card.querySelector('.expand-btn');
  if(btn) toggleTask(e, btn);
}
function toggleNode(taskId, idx){
  const task = findTask('main', taskId); if(!task) return;
  task.nodes[idx].done = !task.nodes[idx].done;
  const nodeEl = document.querySelector(`.node[data-task="${taskId}"][data-idx="${idx}"]`);
  nodeEl.classList.toggle('done', task.nodes[idx].done);
  const card = nodeEl.closest('.task-card');
  const done = task.nodes.filter(n=>n.done).length;
  card.querySelector('.node-count .done').textContent = done;
  const nodes = card.querySelector('.task-nodes');
  if(card.classList.contains('expanded')) nodes.style.maxHeight = 'none';
  saveData(); renderReminders();
}
function toggleSideDone(id){
  const t = sideTasks.find(x=>x.id===id); if(!t) return;
  t.done = !t.done;
  renderSide(); renderReminders(); saveData();
}
function dailyToggle(id, idx){
  for(const g of dailyTaskData){
    const t = g.tasks.find(x=>x.id===id);
    if(t){
      if(idx < t.weekDone) t.weekDone = idx;
      else t.weekDone = idx + 1;
      const card = document.querySelector(`.daily-card[data-id="${id}"]`);
      if(card) card.outerHTML = renderDailyCard(t, g.freq);
      saveData(); renderReminders();
      break;
    }
  }
}

function findTask(board, id){
  if(board==='main'){ for(const m of mainTaskData){ const t=m.tasks.find(x=>x.id===id); if(t) return t; } }
  if(board==='side'){ return sideTasks.find(x=>x.id===id); }
  if(board==='daily'){ for(const g of dailyTaskData){ const t=g.tasks.find(x=>x.id===id); if(t) return t; } }
  return null;
}
function deleteTask(board, id){
  const t = findTask(board, id);
  const name = t ? t.name : '该任务';
  askConfirm(`确定要删除「${name}」吗？此操作不可恢复。`, ()=>{
    if(board==='main'){ mainTaskData.forEach(m=>{ m.tasks = m.tasks.filter(x=>x.id!==id); }); }
    if(board==='side'){ sideTasks = sideTasks.filter(x=>x.id!==id); }
    if(board==='daily'){ dailyTaskData.forEach(g=>{ g.tasks = g.tasks.filter(x=>x.id!==id); }); }
    saveData(); renderAll();
  });
}
/* 复制任务：基于现有任务创建副本，名称加"(副本)"，星标状态重置 */
function duplicateTask(board, id){
  const t = findTask(board, id);
  if(!t) return;
  const copy = JSON.parse(JSON.stringify(t));
  copy.id = board[0] + 'c' + Date.now().toString(36);
  copy.name = (t.name||'') + '(副本)';
  copy.starred = false; copy.ignored = false; copy.autoIgnored = false;
  if(board==='main' && copy.nodes){ copy.nodes = copy.nodes.map(n=>({...n, starred:false, ignored:false, autoIgnored:false})); }
  if(board==='main'){
    const mi = parseInt(String(copy.deadlineMonth).replace(/[^\d]/g,''));
    const yr = copy.deadlineYear || '2026';
    const targetKey = yr + '-' + String(mi).padStart(2,'0');
    let target = mainTaskData.find(m=>m.monthKey===targetKey);
    if(!target){
      target = { month:yr+'年'+mi+'月', monthKey:targetKey, tasks:[] };
      mainTaskData.push(target);
      mainTaskData.sort((a,b)=> a.monthKey.localeCompare(b.monthKey));
    }
    target.tasks.push(copy);
    sortTasksByDeadline(target.tasks);
  } else if(board==='side'){
    sideTasks.push(copy);
    sortTasksByDeadline(sideTasks);
  } else if(board==='daily'){
    const g = dailyTaskData.find(g=>g.freq===copy.freq) || dailyTaskData[0];
    g.tasks.push(copy);
  }
  saveData(); renderAll();
}
let confirmCb = null;
function askConfirm(msg, cb){
  document.getElementById('confirmMsg').textContent = msg;
  confirmCb = cb;
  document.getElementById('confirmOverlay').classList.add('show');
}
function closeConfirm(){ document.getElementById('confirmOverlay').classList.remove('show'); confirmCb = null; }
document.getElementById('confirmYes').onclick = ()=>{ const cb = confirmCb; closeConfirm(); if(cb) cb(); };

/* ============ 板块切换 ============ */
function switchBoard(name){
  currentBoard = name;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.board===name));
  document.querySelectorAll('.board').forEach(b=>b.hidden = b.id !== 'board-'+name);
  renderReminders();
  if(name==='main'){
    document.querySelectorAll('#mainTimeline .task-card.expanded .task-nodes').forEach(n=>{ n.style.maxHeight='none'; });
  }
}

/* ============ 按人员筛选（多选） ============ */
let currentFilters = [];
function toggleFilter(person){
  const i = currentFilters.indexOf(person);
  if(i>=0) currentFilters.splice(i,1); else currentFilters.push(person);
  document.querySelectorAll('.filter').forEach(f=>f.classList.toggle('active', currentFilters.includes(f.dataset.filter)));
  applyFilter();
}
function applyFilter(){
  const sel = currentFilters;
  document.querySelectorAll('.task-card[data-board="main"], .task-card[data-board="side"]').forEach(card=>{
    const members = (card.dataset.members||'').split(',');
    const match = sel.length===0 || sel.some(p=>members.includes(p));
    card.classList.toggle('hidden', !match);
  });
  document.querySelectorAll('.daily-card').forEach(card=>{
    const members = (card.dataset.members||'').split(',');
    const match = sel.length===0 || sel.some(p=>members.includes(p));
    card.classList.toggle('hidden', !match);
  });
  updateCounts();
  renderReminders();
}
function updateCounts(){
  const mainVis = document.querySelectorAll('.task-card[data-board="main"]:not(.hidden)').length;
  const sideVis = document.querySelectorAll('.task-card[data-board="side"]:not(.hidden)').length;
  const dailyVis = document.querySelectorAll('.daily-card:not(.hidden)').length;
  document.getElementById('cnt-main').textContent = mainVis;
  document.getElementById('cnt-side').textContent = sideVis;
  document.getElementById('cnt-daily').textContent = dailyVis;
  document.querySelectorAll('.month-group[data-board="main"]').forEach(group=>{
    const vis = group.querySelectorAll('.task-card:not(.hidden)').length;
    const total = group.querySelectorAll('.task-card').length;
    group.querySelector('[data-count]').textContent = vis>0 ? vis+' 项任务' : (total>0?'已筛选隐藏':'暂无任务');
    group.style.display = vis>0?'':'none';
  });
  document.querySelectorAll('.daily-group').forEach(group=>{
    const vis = group.querySelectorAll('.daily-card:not(.hidden)').length;
    const total = group.querySelectorAll('.daily-card').length;
    group.querySelector('.daily-count').textContent = vis>0 ? vis+' 项' : (total>0?'已筛选隐藏':'暂无任务');
    group.style.display = vis>0?'':'none';
  });
  document.getElementById('sideEmpty').classList.toggle('show', sideVis===0);
}

/* ============ 任务编辑器 ============ */
let editing = {board:null, id:null};
function openEditor(board, id){
  editing = {board, id:id||null};
  const t = id ? findTask(board, id) : null;
  document.getElementById('modalTitle').textContent = id?'编辑任务':'添加任务';
  document.getElementById('modalBody').innerHTML = renderEditorFields(board, t);
  if(board==='main') renderNodeRows(t);
  if(board==='daily') syncDailyLabels();   /* 表单渲染后同步统计 label 与当前频率 */
  document.getElementById('overlay').classList.add('show');
}
function closeEditor(){ document.getElementById('overlay').classList.remove('show'); }
/* 根据年月生成可选日期（1~该月最大天数） */
function daysInMonth(year, month){
  const y = parseInt(year) || 2026;
  const m = parseInt(month) || 1;
  return new Date(y, m, 0).getDate();
}
function dayOptions(year, month, selected){
  const max = daysInMonth(year, month);
  let html = '';
  for(let i=1;i<=max;i++){
    html += `<option value="${i}" ${String(selected)===String(i)?'selected':''}>${i}日</option>`;
  }
  if(selected==='待定') html += `<option value="待定" selected>待定</option>`;
  else html += `<option value="待定">待定</option>`;
  return html;
}
function refreshDayOptions(){
  const y = document.getElementById('f-year')?.value || '2026';
  const m = document.getElementById('f-month')?.value || '1月';
  const daySel = document.getElementById('f-day');
  if(!daySel) return;
  const cur = daySel.value;
  daySel.innerHTML = dayOptions(y, m, cur);
}
function renderEditorFields(board, t){
  const typeOpts = Object.entries(TYPE_MAP).map(([k,v])=>`<option value="${k}" ${t&&t.type===k?'selected':''}>${v.name}</option>`).join('');
  const yearOpts = ['2026','2027'].map(y=>`<option value="${y}" ${t&&t.deadlineYear===y?'selected':''}>${y}年</option>`).join('');
  const monthOpts = Array.from({length:12},(_,i)=>`<option value="${(i+1)}月" ${t&&t.deadlineMonth===((i+1)+'月')?'selected':''}>${i+1}月</option>`).join('');
  const memberChips = name => `<span class="chip ${t&&t.members&&t.members.includes(name)?'selected':''}" data-name="${name}" onclick="toggleChip(this)">${name}</span>`;
  const memberHtml = MEMBER_LIST.map(memberChips).join('');
  const v = (s)=> (s==null?'':String(s)).replace(/"/g,'&quot;');
  if(board==='main'){
    return `
      <div class="field"><label>任务名称</label><input id="f-name" value="${v(t&&t.name)}"></div>
      <div class="field-row">
        <div class="field"><label>类型</label><select id="f-type">${typeOpts}</select></div>
        <div class="field"><label>截止年份</label><select id="f-year" onchange="refreshDayOptions()">${yearOpts}</select></div>
        <div class="field"><label>截止月份</label><select id="f-month" onchange="refreshDayOptions()">${monthOpts}</select></div>
        <div class="field"><label>截止日期</label><select id="f-day">${dayOptions(t&&t.deadlineYear||'2026', t&&t.deadlineMonth||'1月', t&&t.deadlineDay||1)}</select></div>
      </div>
      <div class="field"><label>负责人（可多选）</label><div class="chips" id="f-members">${memberHtml}</div></div>
      <div class="field"><label>任务节点</label><div class="node-editor"><div class="node-rows" id="nodeRows"></div><button class="add-node-btn" onclick="addNodeRow()">+ 添加节点</button></div></div>`;
  }
  if(board==='side'){
    return `
      <div class="field"><label>任务名称</label><input id="f-name" value="${v(t&&t.name)}"></div>
      <div class="field-row">
        <div class="field"><label>类型</label><select id="f-type">${typeOpts}</select></div>
        <div class="field"><label>截止年份</label><select id="f-year" onchange="refreshDayOptions()">${yearOpts}</select></div>
        <div class="field"><label>截止月份</label><select id="f-month" onchange="refreshDayOptions()">${monthOpts}</select></div>
        <div class="field"><label>截止日期</label><select id="f-day">${dayOptions(t&&t.deadlineYear||'2026', t&&t.deadlineMonth||'1月', t&&t.deadlineDay||1)}</select></div>
      </div>
      <div class="field"><label>负责人（可多选）</label><div class="chips" id="f-members">${memberHtml}</div></div>
      <div class="field"><label>任务说明</label><textarea id="f-desc" rows="3">${v(t&&t.desc)}</textarea></div>`;
  }
  if(board==='daily'){
    const freqOpts = [['daily','每日'],['weekly','每周'],['monthly','每月']].map(([k,v])=>`<option value="${k}" ${t&&t.freq===k?'selected':''}>${v}</option>`).join('');
    const curOwners = t ? (t.owners || [t.owner]) : [];
    const ownerChips = MEMBER_LIST.map(name=>`<span class="chip ${curOwners.includes(name)?'selected':''}" data-name="${name}" onclick="toggleChip(this)">${name}</span>`).join('');
    return `
      <div class="field"><label>任务名称</label><input id="f-name" value="${v(t&&t.name)}"></div>
      <div class="field"><label>任务说明</label><textarea id="f-desc" rows="2">${v(t&&t.desc)}</textarea></div>
      <div class="field"><label>负责人（可多选）</label><div class="chips" id="f-owner">${ownerChips}</div></div>
      <div class="field"><label>频率</label><select id="f-freq" onchange="syncDailyLabels()">${freqOpts}</select></div>
      <div class="field-row">
        <div class="field"><label id="f-label-total">${freqLabel(t&&t.freq,'total')}</label><input id="f-total" type="number" min="1" value="${v(t&&t.weekTotal)}"></div>
        <div class="field"><label id="f-label-done">${freqLabel(t&&t.freq,'done')}</label><input id="f-done" type="number" min="0" value="${v(t&&t.weekDone)}"></div>
      </div>`;
  }
}
function toggleChip(el){
  const parent = el.parentElement;
  if(parent.dataset.single){
    parent.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
    el.classList.add('selected');
  } else { el.classList.toggle('selected'); }
}
/* 根据频率返回统计 label 文本：daily→本日 / weekly→本周 / monthly→本月 */
function freqLabel(freq, kind){
  const base = freq==='daily'?'本日':freq==='monthly'?'本月':'本周';
  return base + (kind==='total'?'总数':'已完成');
}
/* 频率改变时联动两个统计 label */
function syncDailyLabels(){
  const sel = document.getElementById('f-freq');
  if(!sel) return;
  const freq = sel.value;
  const lt = document.getElementById('f-label-total');
  const ld = document.getElementById('f-label-done');
  if(lt) lt.textContent = freqLabel(freq,'total');
  if(ld) ld.textContent = freqLabel(freq,'done');
}
function addNodeRow(node){
  node = node || {name:'',owner:'',deadline:''};
  const row = document.createElement('div');
  row.className = 'node-row';
  /* 解析节点已有 deadline 字符串（如"7月22日"）和 dueDateISO */
  let curY='2026', curM='1月', curD='1';
  if(node.dueDateISO){
    const dt = new Date(node.dueDateISO+'T00:00:00');
    curY = String(dt.getFullYear());
    curM = (dt.getMonth()+1)+'月';
    curD = String(dt.getDate());
  } else if(node.deadline){
    const mt = String(node.deadline).match(/(\d+)月(\d+)日/);
    if(mt){ curM = mt[1]+'月'; curD = mt[2]; }
  }
  const yOpts = ['2026','2027'].map(y=>`<option value="${y}" ${curY===y?'selected':''}>${y}</option>`).join('');
  const mOpts = Array.from({length:12},(_,i)=>`<option value="${(i+1)}月" ${curM===((i+1)+'月')?'selected':''}>${i+1}月</option>`).join('');
  const maxD = daysInMonth(curY, curM);
  let dOpts = '';
  for(let i=1;i<=maxD;i++){ dOpts += `<option value="${i}" ${curD===String(i)?'selected':''}>${i}日</option>`; }
  dOpts += `<option value="待定" ${curD==='待定'?'selected':''}>待定</option>`;
  const checked = node.done ? 'checked' : '';
  const ownerList = MEMBER_LIST.map(n=>`<option value="${n}">`).join('');
  const ownerVal = node.owner || '';
  row.innerHTML = `
    <input class="nd-name" placeholder="节点名称" value="${node.name||''}">
    <input class="nd-owner" placeholder="负责人" list="ownerList" value="${ownerVal}" onfocus="this._ov=this.value;this.value=''" onblur="if(this._ov&&!this.value)this.value=this._ov">
    <div class="nd-due">
      <select class="nd-year" onchange="refreshNodeDays(this)">${yOpts}</select>
      <select class="nd-month" onchange="refreshNodeDays(this)">${mOpts}</select>
      <select class="nd-day">${dOpts}</select>
    </div>
    <label class="nd-done"><input type="checkbox" ${checked}>完成</label>
    <button class="del-node" onclick="askConfirm('确定删除该节点？',()=>this.parentElement.remove())">×</button>`;
  if(!document.getElementById('ownerList')){
    const dl = document.createElement('datalist'); dl.id='ownerList'; dl.innerHTML=ownerList; document.body.appendChild(dl);
  }
  document.getElementById('nodeRows').appendChild(row);
}
function refreshNodeDays(sel){
  const row = sel.closest('.node-row');
  const y = row.querySelector('.nd-year').value;
  const m = row.querySelector('.nd-month').value;
  const daySel = row.querySelector('.nd-day');
  const cur = daySel.value;
  const max = daysInMonth(y, m);
  let html = '';
  for(let i=1;i<=max;i++){ html += `<option value="${i}" ${cur===String(i)?'selected':''}>${i}日</option>`; }
  html += `<option value="待定" ${cur==='待定'?'selected':''}>待定</option>`;
  daySel.innerHTML = html;
}
function renderNodeRows(t){
  document.getElementById('nodeRows').innerHTML='';
  if(t && t.nodes && t.nodes.length){ t.nodes.forEach(n=>addNodeRow(n)); }
  else { addNodeRow(); }
}
function sortTasksByDeadline(tasks){
  tasks.sort((a,b)=>{
    const ya = parseInt(a.deadlineYear)||9999;
    const yb = parseInt(b.deadlineYear)||9999;
    if(ya!==yb) return ya-yb;
    const ma = parseInt(String(a.deadlineMonth).replace(/[^\d]/g,''))||99;
    const mb = parseInt(String(b.deadlineMonth).replace(/[^\d]/g,''))||99;
    if(ma!==mb) return ma-mb;
    const da = parseInt(a.deadlineDay)||999;
    const db = parseInt(b.deadlineDay)||999;
    return da-db;
  });
}
function collectForm(board){
  const name = document.getElementById('f-name').value.trim();
  if(!name){ alert('请输入任务名称'); return null; }
  if(board==='main' || board==='side'){
    const members = [...document.querySelectorAll('#f-members .chip.selected')].map(c=>c.dataset.name);
    if(members.length===0){ alert('请选择至少一位负责人'); return null; }
    const base = {
      type: document.getElementById('f-type').value,
      name, project:'',
      deadlineYear: document.getElementById('f-year').value,
      deadlineMonth: document.getElementById('f-month').value,
      deadlineDay: String(document.getElementById('f-day').value||'1'),
      members
    };
    if(board==='main'){
      const nodes = [...document.querySelectorAll('.node-row')].map(r=>{
        const y = r.querySelector('.nd-year').value;
        const m = r.querySelector('.nd-month').value;
        const d = r.querySelector('.nd-day').value;
        const mNum = parseInt(m);
        const deadline = d==='待定' ? '待定' : `${m}${d}日`;
        const dueDateISO = d==='待定' ? null : `${y}-${String(mNum).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        return {
          name: r.querySelector('.nd-name').value.trim(),
          owner: r.querySelector('.nd-owner').value.trim() || MEMBER_LIST[0],
          deadline, dueDateISO,
          done: r.querySelector('.nd-done input').checked
        };
      }).filter(n=>n.name);
      return Object.assign(base, {nodes});
    } else {
      return Object.assign(base, {desc: document.getElementById('f-desc').value.trim(), done:false});
    }
  }
  if(board==='daily'){
    const owners = [...document.querySelectorAll('#f-owner .chip.selected')].map(c=>c.dataset.name);
    if(owners.length===0){ alert('请选择至少一位负责人'); return null; }
    return {
      name, desc: document.getElementById('f-desc').value.trim(),
      owners, freq: document.getElementById('f-freq').value,
      weekTotal: parseInt(document.getElementById('f-total').value)||1,
      weekDone: parseInt(document.getElementById('f-done').value)||0
    };
  }
}
function saveTask(){
  const data = collectForm(editing.board);
  if(!data) return;
  if(editing.id){
    const orig = findTask(editing.board, editing.id);
    const keepStar = {starred:orig.starred, ignored:orig.ignored};
    if(editing.board==='daily'){
      if(data.freq !== orig.freq){
        dailyTaskData.forEach(g=>{ g.tasks = g.tasks.filter(t=>t.id!==editing.id); });
        Object.assign(orig, data, keepStar);
        const g = dailyTaskData.find(g=>g.freq===data.freq);
        g.tasks.push(orig);
      } else { Object.assign(orig, data, keepStar); }
    } else if(editing.board==='main'){
      Object.assign(orig, data, keepStar);
      const mi = parseInt(data.deadlineMonth);
      const yr = data.deadlineYear || '2026';
      const targetKey = yr + '-' + String(mi).padStart(2,'0');
      const curMonth = mainTaskData.find(m=>m.tasks.includes(orig));
      if(!curMonth || curMonth.monthKey !== targetKey){
        if(curMonth) curMonth.tasks = curMonth.tasks.filter(t=>t!==orig);
        let target = mainTaskData.find(m=>m.monthKey===targetKey);
        if(!target){
          target = { month:yr+'年'+mi+'月', monthKey:targetKey, tasks:[] };
          mainTaskData.push(target);
          mainTaskData.sort((a,b)=> a.monthKey.localeCompare(b.monthKey));
        }
        target.tasks.push(orig);
      }
      const target = mainTaskData.find(m=>m.tasks.includes(orig));
      sortTasksByDeadline(target.tasks);
    } else {
      Object.assign(orig, data, keepStar);
      sortTasksByDeadline(sideTasks);
    }
  } else {
    data.id = editing.board[0] + Date.now().toString(36);
    data.starred = false; data.ignored = false;
    if(editing.board==='main'){
      const mi = parseInt(data.deadlineMonth);
      const yr = data.deadlineYear || '2026';
      const targetKey = yr + '-' + String(mi).padStart(2,'0');
      let target = mainTaskData.find(m=>m.monthKey===targetKey);
      if(!target){
        target = { month:yr+'年'+mi+'月', monthKey:targetKey, tasks:[] };
        mainTaskData.push(target);
        mainTaskData.sort((a,b)=> a.monthKey.localeCompare(b.monthKey));
      }
      target.tasks.push(data);
      sortTasksByDeadline(target.tasks);
    } else if(editing.board==='side'){
      sideTasks.push(data);
      sortTasksByDeadline(sideTasks);
    } else if(editing.board==='daily'){
      const g = dailyTaskData.find(g=>g.freq===data.freq) || dailyTaskData[0];
      g.tasks.push(data);
    }
  }
  saveData(); renderAll(); closeEditor();
}

function renderAll(){ renderMain(); renderSide(); renderDaily(); renderReminders(); updateCounts(); }

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>switchBoard(t.dataset.board)));
document.querySelectorAll('.filter').forEach(f=>f.addEventListener('click', ()=>toggleFilter(f.dataset.filter)));
